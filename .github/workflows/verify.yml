name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install shell test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep zsh
      - name: Run canonical hermetic verification
        run: ./bin/verify.sh
